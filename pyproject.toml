[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermit-opencode"
version = "0.1.1"
description = "Convert a hermit adapter into an OpenCode configuration"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
hermit-opencode = "hermit_opencode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
